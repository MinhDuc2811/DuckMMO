name: Code quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          enable-cache: true
      - run: uv sync --frozen --group dev --python 3.12
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Choose comparison base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "QUALITY_BASE=$PR_BASE" >> "$GITHUB_ENV"
          else
            echo "QUALITY_BASE=$PUSH_BASE" >> "$GITHUB_ENV"
          fi
      - run: uv run --frozen python scripts/check_quality.py ci --base "$QUALITY_BASE"
      - run: uv run --frozen playwright install --with-deps chromium
      - name: Browser upload and workflow regression
        run: >-
          uv run --frozen pytest -q e2e/test_media_upload.py
          test_suite/features/speech/e2e --run-e2e
